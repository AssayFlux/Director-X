<rect x="665" y="225" width="440" height="700" rx="18" fill="#F5F0E6" stroke="#8C8275" stroke-width="2"/>
<rect x="685" y="245" width="400" height="56" rx="10" fill="#EAE3D2"/><text x="705" y="280" class="t">←  Settings</text>
<text x="695" y="345" class="h">Settings overview</text><text x="695" y="375" class="s">Keep current editor mode + autosave summary</text>
