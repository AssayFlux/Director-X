<defs><style>
.bg{fill:#F5F0E6}.panel{fill:#EAE3D2;stroke:#8C8275;stroke-width:2}.ink{fill:#2C2621}.muted{fill:#71685e}.gold{fill:#C29B38}.line{stroke:#8C8275;stroke-width:2;fill:none}.dash{stroke:#C29B38;stroke-width:2;stroke-dasharray:8 7;fill:none}.h{font:700 32px Georgia,serif;fill:#2C2621}.t{font:20px Arial,sans-serif;fill:#2C2621}.s{font:16px Arial,sans-serif;fill:#71685e}.dim{font:700 17px Arial,sans-serif;fill:#9A741D}
</style></defs>
<rect class="bg" width="1200" height="1600"/>
<text x="60" y="65" class="h">DIRECTOR X — LAYOUT BLUEPRINT</text><text x="60" y="100" class="s">Conceptual target wireframes • dp dimensions are design targets unless explicitly marked as measured baseline</text>
