name: Repository hygiene

on:
  push:
    branches: [Alpha]
  pull_request:
    branches: [Alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository, identity and policy validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect unapproved exact duplicates
        run: python scripts/check_repository_duplicates.py

      - name: Verify native FFmpeg patch lock and source offer
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          lock = json.loads((root / "third_party/ffmpeg-kit-next/native-lock.json").read_text())
          patch = root / lock["source"]["securityPatch"]
          assert patch.is_file(), f"native security patch missing: {patch}"
          actual = hashlib.sha256(patch.read_bytes().replace(b"\\r\\n", b"\\n")).hexdigest()
          expected = lock["source"]["securityPatchSha256"]
          assert actual == expected, f"native patch SHA-256 mismatch: expected={expected} actual={actual}"
          offer = (root / "app/src/main/res/raw/ffmpeg_kit_next_source_offer.txt").read_text()
          assert lock["source"]["securityPatch"] in offer, "LGPL source offer does not identify the locked security patch"
          print(f"verified native patch: {patch} ({actual})")
          PY

      - name: Validate Android package identity
        run: python scripts/validate_package_identity.py

      - name: Validate application version consistency
        run: python scripts/validate_version_consistency.py

      - name: Validate README links and assets
        run: python scripts/validate_readme_links.py

      - name: Validate generated capability registry
        run: python scripts/generate_capability_registry.py --check

      - name: Validate public feature claims
        run: python scripts/validate_public_claims.py

      - name: Validate Android audio API policy
        run: python scripts/validate_android_audio_api_policy.py

      - name: Run validator self-tests
        run: |
          python scripts/validate_package_identity.py --self-test
          python scripts/validate_android_audio_api_policy.py --self-test
          python scripts/check_16kb_alignment.py --self-test
          python scripts/validate_apk_outputs.py --self-test
