name: Build and verify FFmpegKitNext 9.0.2

on:
  workflow_dispatch:
  push:
    branches: [Alpha, upgrade-ffmpeg-9.0.2]
    paths:
      - "scripts/prepare_ffmpeg_kit_next_9_source.sh"
      - "scripts/verify_native_supply_chain.py"
      - "third_party/ffmpeg-kit-next/directorx-security.patch"
      - ".github/workflows/ffmpeg-kit-next-9-build.yml"
  pull_request:
    branches: [Alpha]
    paths:
      - "scripts/prepare_ffmpeg_kit_next_9_source.sh"
      - "scripts/verify_native_supply_chain.py"
      - "third_party/ffmpeg-kit-next/directorx-security.patch"
      - ".github/workflows/ffmpeg-kit-next-9-build.yml"

permissions:
  contents: read

concurrency:
  group: ffmpeg-kit-next-9.0.2-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build Android ABI ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: armeabi-v7a
            arch: arm-v7a
          - label: armeabi-v7a-neon
            arch: arm-v7a-neon
          - label: arm64-v8a
            arch: arm64-v8a
          - label: x86
            arch: x86
          - label: x86_64
            arch: x86-64
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gnupg xz-utils binutils

      - name: Verify FFmpeg 9.0.2 release tarball signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authenticity
          cd authenticity
          curl --fail --location --silent --show-error https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz -o ffmpeg-9.0.2.tar.xz
          curl --fail --location --silent --show-error https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc -o ffmpeg-9.0.2.tar.xz.asc
          curl --fail --location --silent --show-error https://ffmpeg.org/ffmpeg-devel.asc | gpg --import
          gpg --with-colons --fingerprint FCF986EA15E6E293A5644F10B4322F04D67658D8 | grep -F 'FCF986EA15E6E293A5644F10B4322F04D67658D8'
          gpg --verify ffmpeg-9.0.2.tar.xz.asc ffmpeg-9.0.2.tar.xz

      - name: Verify signed upstream n9.0.2 Git tag
        shell: bash
        run: |
          set -euo pipefail
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys DD1EC9E8DE085C629B3E1846B18E8928B3948D64
          git init ffmpeg-upstream
          git -C ffmpeg-upstream remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C ffmpeg-upstream fetch --depth=1 origin refs/tags/n9.0.2:refs/tags/n9.0.2
          test "$(git -C ffmpeg-upstream rev-parse refs/tags/n9.0.2)" = "ce8f11b9fac4cd7ccfb41ca7c01bc17f5cda8cc3"
          git -C ffmpeg-upstream checkout --detach n9.0.2
          git -C ffmpeg-upstream verify-tag n9.0.2
          git -C ffmpeg-upstream verify-tag --verbose n9.0.2 2>&1 | tee authenticity/tag-verification.txt
          grep -E 'Primary key fingerprint: DD1E C9E8 DE08 5C62 9B3E[[:space:]]+1846 B18E 8928 B394 8D64' authenticity/tag-verification.txt
          echo "FFMPEG_RELEASE_COMMIT=$(git -C ffmpeg-upstream rev-parse 'n9.0.2^{commit}')" >> "$GITHUB_ENV"

      - name: Check out pinned FFmpegKitNext wrapper
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: 9f04bf1e3c97def70b98e198cb80a57b43ef5b45
          path: ffmpeg-kit-next
          persist-credentials: false

      - name: Apply Director X security profile and reviewed backports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ffmpeg-kit-next rev-parse HEAD)" = "9f04bf1e3c97def70b98e198cb80a57b43ef5b45"
          git -C ffmpeg-kit-next config core.autocrlf false
          git -C ffmpeg-kit-next apply --check "$GITHUB_WORKSPACE/third_party/ffmpeg-kit-next/directorx-security.patch"
          git -C ffmpeg-kit-next apply "$GITHUB_WORKSPACE/third_party/ffmpeg-kit-next/directorx-security.patch"
          bash "$GITHUB_WORKSPACE/scripts/prepare_ffmpeg_kit_next_9_source.sh" "$GITHUB_WORKSPACE/ffmpeg-kit-next/scripts/source.sh"
          bash -n ffmpeg-kit-next/scripts/android/ffmpeg.sh
          git -C ffmpeg-kit-next diff --check

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build only ${{ matrix.label }}
        working-directory: ffmpeg-kit-next
        shell: bash
        env:
          ABI_ARCH: ${{ matrix.arch }}
          ABI_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          export version_ffmpeg=n9.0.2
          export RECONF_fribidi=1
          ./nix-android.sh -p android-r27d --arch="$ABI_ARCH" --enable-lib-libass --enable-lib-libjxl --enable-lib-android-media-codec --enable-lib-android-zlib --enable-lib-openh264 --jobs=8 2>&1 | tee "$GITHUB_WORKSPACE/build-output/native-build-transcript-$ABI_LABEL.log"
          test "$(git -C src/ffmpeg rev-parse HEAD)" = "$FFMPEG_RELEASE_COMMIT"
          cp build.log "$GITHUB_WORKSPACE/build-output/build-$ABI_LABEL.log"
          mapfile -t aars < <(find prebuilt -type f -name 'ffmpeg-kit-next-9.0.2.aar' -print)
          mapfile -t poms < <(find prebuilt -type f -name 'ffmpeg-kit-next-9.0.2.pom' -print)
          test "${#aars[@]}" -eq 1
          test "${#poms[@]}" -eq 1
          cp "${aars[0]}" "$GITHUB_WORKSPACE/build-output/ffmpeg-kit-next-9.0.2-$ABI_LABEL.aar"
          cp "${poms[0]}" "$GITHUB_WORKSPACE/build-output/ffmpeg-kit-next-9.0.2-$ABI_LABEL.pom"

      - name: Upload ABI build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-9.0.2-abi-${{ matrix.label }}-${{ github.run_id }}
          path: |
            build-output/*
            authenticity/*
          if-no-files-found: warn
          retention-days: 30

  verify-native:
    name: Merge and verify all five Android ABIs
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download ABI outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-kit-next-9.0.2-abi-*-${{ github.run_id }}
          path: abi-output
          merge-multiple: true

      - name: Merge per-ABI AARs into one release AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile, shutil
          root = pathlib.Path("abi-output")
          labels = ["armeabi-v7a", "armeabi-v7a-neon", "arm64-v8a", "x86", "x86_64"]
          base = root / "ffmpeg-kit-next-9.0.2-arm64-v8a.aar"
          if not base.is_file():
              raise SystemExit(f"Missing base AAR: {base}")
          merged = pathlib.Path("build-output/merged-aar")
          merged.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(base) as z:
              z.extractall(merged)
          jni = merged / "jni"
          if jni.exists():
              shutil.rmtree(jni)
          jni.mkdir()
          for label in labels:
              aar = root / f"ffmpeg-kit-next-9.0.2-{label}.aar"
              pom = root / f"ffmpeg-kit-next-9.0.2-{label}.pom"
              if not aar.is_file() or not pom.is_file():
                  raise SystemExit(f"ABI output missing for {label}")
              with zipfile.ZipFile(aar) as z:
                  entries = [n for n in z.namelist() if n.startswith("jni/") and n.endswith(".so")]
                  if not entries:
                      raise SystemExit(f"No JNI libraries in {aar}")
                  for name in entries:
                      target = merged / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(name))
          out = pathlib.Path("build-output/ffmpeg-kit-next-9.0.2.aar")
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for path in sorted(merged.rglob("*")):
                  if path.is_file():
                      z.write(path, path.relative_to(merged).as_posix())
          shutil.copy2(root / "ffmpeg-kit-next-9.0.2-arm64-v8a.pom",
                       pathlib.Path("build-output/ffmpeg-kit-next-9.0.2.pom"))
          PY
          mkdir -p build-output
          for label in armeabi-v7a armeabi-v7a-neon arm64-v8a x86 x86_64; do
            test -f "abi-output/native-build-transcript-$label.log"
            test -f "abi-output/build-$label.log"
          done
          cp abi-output/*log build-output/ 2>/dev/null || true

      - name: Verify merged AAR, POM, ABIs, alignment and configure profile
        shell: bash
        run: |
          set -euo pipefail
          test -s build-output/ffmpeg-kit-next-9.0.2.aar
          test -s build-output/ffmpeg-kit-next-9.0.2.pom
          python3 - <<'PY'
          import pathlib, re, subprocess, zipfile, xml.etree.ElementTree as ET
          aar = pathlib.Path("build-output/ffmpeg-kit-next-9.0.2.aar")
          pom = pathlib.Path("build-output/ffmpeg-kit-next-9.0.2.pom")
          required = {"armeabi-v7a", "arm64-v8a", "x86", "x86_64"}
          with zipfile.ZipFile(aar) as z:
              names = z.namelist()
              abis = {n.split("/")[1] for n in names if n.startswith("jni/") and n.endswith(".so") and len(n.split("/")) > 2}
              if abis != required:
                  raise SystemExit(f"ABI directory mismatch: required={sorted(required)} found={sorted(abis)}")
              armv7_neon = {pathlib.PurePosixPath(n).name for n in names
                            if n.startswith("jni/armeabi-v7a/") and n.endswith("_neon.so")}
              if not armv7_neon:
                  raise SystemExit("armeabi-v7a NEON variant libraries are missing")
              z.extractall("build-output/new-aar")
          root = ET.parse(pom).getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=ns)
          if version != "9.0.2":
              raise SystemExit(f"POM version mismatch: {version!r}")
          patch = pathlib.Path("third_party/ffmpeg-kit-next/directorx-security.patch").read_text()
          disabled = re.findall(r'--disable-(?:demuxer|decoder|encoder)=[A-Za-z0-9_]+', patch)
          for abi in sorted(required):
              libs = list(pathlib.Path("build-output/new-aar/jni", abi).glob("*.so"))
              if not libs:
                  raise SystemExit(f"No native libraries found for {abi}")
              required_alignment = 0x4000 if abi in {"arm64-v8a", "x86_64"} else 0x1000
              for lib in libs:
                  out = subprocess.check_output(["readelf", "-lW", str(lib)], text=True)
                  aligns = [int(m.group(1), 16) for m in re.finditer(r"^\s*LOAD\s+.*?\s(0x[0-9a-fA-F]+)\s*$", out, re.M)]
                  if not aligns or min(aligns) < required_alignment:
                      raise SystemExit(f"{abi} LOAD alignment failure (required >= {required_alignment:#x}): {lib}: {aligns}")
                  dynamic = subprocess.check_output(["readelf", "-dW", str(lib)], text=True, errors="replace")
                  if re.search(r"Shared library: \[lib(?:x264|x265)\.so", dynamic, re.I):
                      raise SystemExit(f"Forbidden x264/x265 dynamic dependency in {lib}")
              avutil = pathlib.Path("build-output/new-aar/jni", abi, "libavutil.so")
              strings = subprocess.check_output(["strings", "-a", str(avutil)], text=True, errors="replace")
              configs = [line for line in strings.splitlines() if "--enable-version3" in line]
              if not configs:
                  raise SystemExit(f"--enable-version3 configure string missing in {avutil}")
              config = "\n".join(configs).lower()
              configure_options = set(re.findall(r"(?<!\S)--[a-z0-9][a-z0-9-]*(?:=[^\s]+)?", config))
              required_options = {
                  "--disable-autodetect", "--disable-cuda", "--disable-cuvid",
                  "--disable-nvenc", "--disable-vaapi", "--disable-vdpau",
                  "--disable-videotoolbox",
              }
              missing_options = sorted(required_options - configure_options)
              if missing_options:
                  raise SystemExit(f"Required disabled configure options missing from {avutil}: {missing_options}")
              forbidden_options = {
                  "--enable-gpl", "--enable-nonfree", "--enable-cuda",
                  "--enable-cuvid", "--enable-nvenc", "--enable-nvdec",
                  "--enable-vulkan", "--enable-vaapi", "--enable-vdpau",
                  "--enable-videotoolbox", "--enable-qsv", "--enable-dxva2",
                  "--enable-d3d11va", "--enable-d3d12va",
                  "--enable-libx264", "--enable-libx265", "--enable-libxml2",
                  "--enable-libssh", "--enable-libssh2", "--enable-librist",
                  "--enable-libxevd", "--enable-libwebp", "--enable-libsvtjpegxs",
                  "--enable-libaribcaption", "--enable-liblcevc_dec",
              }
              enabled_forbidden = sorted(configure_options & forbidden_options)
              if enabled_forbidden:
                  raise SystemExit(f"Forbidden enabled configure options in {avutil}: {enabled_forbidden}")
              missing = [flag for flag in disabled if flag not in config]
              if missing:
                  raise SystemExit(f"Security disable flags missing from {avutil}: {missing}")
          print(f"Verified POM={version}, ABIs={sorted(abis)}, AAR size={aar.stat().st_size}")
          PY
          sha256sum build-output/ffmpeg-kit-next-9.0.2.aar build-output/ffmpeg-kit-next-9.0.2.pom | tee build-output/SHA256SUMS

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-9.0.2-evidence-${{ github.run_id }}
          path: |
            build-output/*
            abi-output/*
          if-no-files-found: warn
          retention-days: 30
