name: Temporary FFmpeg 9.0.2 recovery checks

on:
  workflow_run:
    workflows: ["Build and verify FFmpegKitNext 9.0.2"]
    types: [completed]
    branches: [Alpha]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-native-and-packaging-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.run_attempt < 2)
    runs-on: ubuntu-24.04
    steps:
      - name: Retry only the failed FFmpeg verification job once
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Requested one retry of the failed native build job. Its full job includes the AAR/POM/ABI/alignment/configure-profile gate, which was previously skipped after native compilation failed."

      - name: Retry latest failed FFmpeg build on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ffmpeg-kit-next-9-build.yml/runs?branch=Alpha&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "failure")][0].id')"
          test -n "$run_id" && test "$run_id" != "null"
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
          echo "Requested one retry of failed native build and its downstream packaging gate."
