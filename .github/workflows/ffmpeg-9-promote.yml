name: FFmpeg 9.0.2 - Promote dependency

on:
  workflow_run:
    workflows: ["FFmpeg 9.0.2 - Assemble native package"]
    types: [completed]
    branches: [Alpha]
  workflow_dispatch:
    inputs:
      assembly_run_id:
        description: Successful package-assembly run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Alpha
          fetch-depth: 0

      - name: Validate successful assembly run
        id: source
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.assembly_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$INPUT_RUN_ID"
          if [[ -z "$RUN_ID" ]]; then RUN_ID="$EVENT_RUN_ID"; fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e '.head_branch == "Alpha" and .conclusion == "success" and .path == ".github/workflows/ffmpeg-9-assemble.yml"' <<<"$run_json" >/dev/null
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download assembled FFmpeg 9.0.2 candidate
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-kit-next-9.0.2-release-candidate-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build-evidence/build-output
          merge-multiple: true

      - name: Read native build provenance
        id: provenance
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          raw = pathlib.Path("build-evidence/build-output/native-build-provenance.json").read_text(encoding="utf-8").rstrip()
          if raw.endswith("\\n"):
              raw = raw[:-2]
          data = json.loads(raw)
          for key, value in (("run_id", data["runId"]), ("head_sha", data["headSha"]), ("built_at", data["builtAt"])):
              if not value:
                  raise SystemExit(f"Missing native provenance field: {key}")
              print(f"{key}={value}")
          PY

      - name: Enforce native supply-chain policy before promotion
        run: |
          set -euo pipefail
          python3 scripts/verify_native_supply_chain.py

      - name: Require complete Android CI for the exact promotion checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-full-ci.yml/runs?branch=Alpha&per_page=50")"
          if ! jq -e --arg sha "$checkout_sha" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' <<<"$runs" >/dev/null; then
            echo "Promotion blocked: Android full verification has not passed for Alpha@$checkout_sha." >&2
            echo "Wait for the exact-commit Android full CI run to pass, then dispatch this promotion workflow again." >&2
            exit 1
          fi

      - name: Verify source-bound native provenance before promotion
        env:
          BUILD_RUN_ID: ${{ steps.provenance.outputs.run_id }}
          BUILD_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BUILD_HEAD_SHA"
          python3 scripts/verify_ffmpeg_promotion_provenance.py \
            --verify --revision "$BUILD_HEAD_SHA" --run-id "$BUILD_RUN_ID" \
            --manifest build-evidence/build-output/native-build-provenance.json

      - name: Promote AAR, POM, lock and app references
        env:
          BUILD_RUN_ID: ${{ steps.provenance.outputs.run_id }}
          BUILD_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          BUILD_COMPLETED_AT: ${{ steps.provenance.outputs.built_at }}
        run: |
          set -euo pipefail
          python3 scripts/promote_ffmpeg_kit_next_9_artifact.py \
            --artifact-dir build-evidence \
            --run-id "$BUILD_RUN_ID" \
            --head-sha "$BUILD_HEAD_SHA" \
            --built-at "$BUILD_COMPLETED_AT"
          git diff --check

      - name: Commit FFmpeg 9.0.2 promotion to Alpha
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "FFmpeg 9.0.2 promotion is already current; no commit required."
            exit 0
          fi
          git commit -m "build(ffmpeg): promote FFmpegKitNext 9.0.2"
          git fetch origin Alpha
          git rebase origin/Alpha
          git push origin HEAD:Alpha
