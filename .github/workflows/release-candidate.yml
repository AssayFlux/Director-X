name: Release candidate verification

on:
  # APK packaging is deliberately manual and reserved for the final release stage.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: director-x-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Release candidate gates and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify native FFmpeg supply chain and generate SBOM
        run: python scripts/verify_native_supply_chain.py

      - name: Validate repository and package policy
        run: |
          python scripts/validate_package_identity.py
          python scripts/validate_version_consistency.py
          python scripts/validate_public_claims.py
          python scripts/check_16kb_alignment.py --self-test
          python scripts/validate_apk_outputs.py --self-test

      - name: Run QA unit tests and lint
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain :app:testQaUnitTest
          ./gradlew --no-daemon --stacktrace --console=plain :app:lintQa

      # Release signing is intentionally not configured from repository files.
      # This job builds a debug-signed validation APK only; the maintainer must
      # perform the final release-signed build with the established private key.
      - name: Build APKs after all source gates pass
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Validate universal and ABI-split APKs
        run: |
          python scripts/validate_apk_outputs.py debug
          find app/build/outputs/apk/debug -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            python scripts/check_16kb_alignment.py "$apk"
          done

      - name: Upload validated APKs and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: director-x-release-candidate-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/native-sbom/*.json
          if-no-files-found: error
          retention-days: 14
