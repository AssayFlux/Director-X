name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: Android build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - qa
          - streaming

permissions:
  contents: read

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build ${{ inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Build selected APK variant
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_VARIANT" in
            debug) TASK=":app:assembleDebug" ;;
            qa) TASK=":app:assembleQa" ;;
            streaming) TASK=":app:assembleStreaming" ;;
            *) echo "Unsupported build variant: $BUILD_VARIANT"; exit 2 ;;
          esac
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace "$TASK"

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ \;
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: director-x-${{ inputs.build_variant || 'debug' }}-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
