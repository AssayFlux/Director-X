name: Build Debug APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - gradle/verification-metadata.xml
  workflow_dispatch:
    inputs:
      build_variant:
        description: Android build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - qa
          - streaming

permissions:
  contents: read

concurrency:
  group: director-x-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build ${{ inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'debug' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Validate repository identity and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_package_identity.py
          python scripts/generate_capability_registry.py --check

      - name: Select build task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_VARIANT" in
            debug) TASK=":app:assembleDebug" ;;
            qa) TASK=":app:assembleQa" ;;
            streaming) TASK=":app:assembleStreaming" ;;
            *) echo "::error::Unsupported build variant: $BUILD_VARIANT"; exit 2 ;;
          esac
          echo "gradle_task=$TASK" >> "$GITHUB_OUTPUT"
          chmod +x ./gradlew

      # KSP resolves a detached configuration while the task executes. A normal
      # dependency scan/help task does not necessarily discover that artifact.
      # Bootstrap checksums against the configured Google/Maven Central
      # repositories, then immediately run the identical build in strict mode.
      - name: Bootstrap dependency verification metadata
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-verification-metadata sha256 --stacktrace "${{ steps.task.outputs.gradle_task }}"

      - name: Build APK with strict dependency verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification strict --stacktrace "${{ steps.task.outputs.gradle_task }}"

      # The verification bootstrap updates only this runner's workspace. Do not
      # push generated metadata from the build job: a concurrent main-branch
      # update must never prevent collection and upload of a successfully built APK.
      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ \;
          APK_COUNT="$(find artifacts -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -gt 0
          echo "Collected $APK_COUNT APK file(s):"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: director-x-${{ inputs.build_variant || 'debug' }}-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
