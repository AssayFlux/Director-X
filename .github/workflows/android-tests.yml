name: Android tests and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    name: QA unit tests and Android lint (no APK build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install and verify Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root was not configured."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          LICENSE_STATUS=$?
          set -o pipefail
          if (( LICENSE_STATUS != 0 )); then
            echo "::error::Android SDK licence acceptance failed (sdkmanager exit $LICENSE_STATUS)."
            exit "$LICENSE_STATUS"
          fi

          sdkmanager --list 2>&1 | tee android-sdk-available.log
          PLATFORM_PACKAGE=""
          for candidate in "platforms;android-37.0" "platforms;android-37"; do
            if grep -Fq "${candidate} |" android-sdk-available.log; then
              PLATFORM_PACKAGE="$candidate"
              break
            fi
          done
          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo "::error::Android SDK Platform 37 is unavailable; refusing to downgrade compileSdk."
            exit 1
          fi
          if ! grep -Fq 'build-tools;36.0.0 |' android-sdk-available.log; then
            echo "::error::Build Tools 36.0.0 required by AGP 9.4.1 are unavailable."
            exit 1
          fi
          sdkmanager "$PLATFORM_PACKAGE" "build-tools;36.0.0"
          test -d "$SDK_ROOT/platforms/${PLATFORM_PACKAGE#platforms;}"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Installed Android SDK platform: $PLATFORM_PACKAGE"
          echo "Installed Build Tools: 36.0.0"

      - name: Validate repository identity and policy metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository_duplicates.py
          python scripts/validate_package_identity.py
          python scripts/validate_version_consistency.py
          python scripts/validate_readme_links.py
          python scripts/generate_capability_registry.py --check
          python scripts/validate_public_claims.py
          python scripts/validate_android_audio_api_policy.py
          python scripts/validate_package_identity.py --self-test
          python scripts/validate_android_audio_api_policy.py --self-test
          python scripts/check_16kb_alignment.py --self-test
          python scripts/validate_apk_outputs.py --self-test

      - name: Run strict dependency verification, QA unit tests and lint only
        shell: bash
        run: |
          set -o pipefail
          GRADLE_ARGS=(
            --no-daemon
            --max-workers=2
            "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"
            --dependency-verification=strict
            --stacktrace
            --console=plain
            :app:testQaUnitTest
            :app:lint
          )
          bash ./gradlew "${GRADLE_ARGS[@]}" 2>&1 | tee android-tests-gradle.log

      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: director-x-android-test-reports-${{ github.run_id }}
          path: |
            android-tests-gradle.log
            build/reports/dependency-verification/**
            build/reports/problems/**
            app/build/test-results/test*UnitTest/**
            app/build/reports/tests/test*UnitTest/**
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14
