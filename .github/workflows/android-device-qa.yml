name: Android device and performance QA

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/run_api37_qa.py"
      - ".github/workflows/android-device-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-api37-instrumentation:
    name: Lint and API 37 instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37.0" "emulator"
          # API 37.0 is installed under android-37.0, while AGP compileSdk=37
          # expects the android-37 directory name on this SDK packaging layout.
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable; managed-device tests may not start."
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap missing dependency verification checksums
        run: |
          chmod +x ./gradlew
          # Bootstrap missing SHA-256 entries, then rerun the same QA tasks below
          # with normal strict dependency verification before accepting results.
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            :app:clearCutApi37QaAndroidTest

      - name: Run Android lint and API 37 managed-device suite
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:lintQa \
            :app:clearCutApi37QaAndroidTest

      - name: Classify API 37 QA results
        if: always()
        run: python3 scripts/run_api37_qa.py --skip-run

      - name: Upload lint and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-api37-qa-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-qa.html
            app/build/reports/lint-results-qa.sarif
            app/build/reports/connected-qa/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/androidTest-results/managedDevice/**
            gradle/verification-metadata.xml
          if-no-files-found: warn
          retention-days: 14

  macrobenchmark:
    name: API 37 startup and editor macrobenchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-37.0" "emulator"
          # API 37.0 is installed under android-37.0, while AGP compileSdk=37
          # expects the android-37 directory name on this SDK packaging layout.
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable; macrobenchmark may not start."
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary benchmark-only signing key
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/directorx-ci-benchmark.p12"
          PASSWORD="benchmark-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias benchmark \
            -dname "CN=Director X CI Benchmark, OU=QA, O=AssayFlux, C=IN" \
            -keyalg RSA -keysize 2048 -validity 2
          {
            echo "CLEARCUT_STORE_FILE=$KEYSTORE"
            echo "CLEARCUT_STORE_PASSWORD=$PASSWORD"
            echo "CLEARCUT_KEY_ALIAS=benchmark"
            echo "CLEARCUT_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Bootstrap missing dependency verification checksums
        run: |
          chmod +x ./gradlew
          # Bootstrap missing SHA-256 entries, then rerun the benchmark below
          # with normal strict dependency verification before accepting results.
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            -x :app:verifyReleaseSigningIdentity \
            :baselineprofile:pixel6Api37BenchmarkReleaseAndroidTest

      - name: Run API 37 macrobenchmark
        run: |
          chmod +x ./gradlew
          # The benchmark APK is disposable and never published. Exclude only the
          # production-certificate identity gate for this ephemeral CI signing key.
          ./gradlew --no-daemon --stacktrace --console=plain --rerun-tasks \
            -x :app:verifyReleaseSigningIdentity \
            :baselineprofile:pixel6Api37BenchmarkReleaseAndroidTest

      - name: Upload macrobenchmark and baseline profile outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-macrobenchmark-${{ github.sha }}
          path: |
            baselineprofile/build/reports/**
            baselineprofile/build/outputs/**
            app/build/generated/baselineProfiles/**
          if-no-files-found: warn
          retention-days: 14
