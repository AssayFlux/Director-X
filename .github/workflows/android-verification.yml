name: Android verification

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-debug-apk:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper and APK validator
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          python3 scripts/validate_apk_outputs.py --self-test

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testQaUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validate generated APKs
        run: |
          python3 scripts/validate_apk_outputs.py debug
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
