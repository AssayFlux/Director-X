name: Android verification

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # Temporary: generate a reviewed snapshot with the corrected metadata refresh logic.
      - name: Refresh dependency freshness snapshot for one-off validation
        run: |
          python scripts/refresh_dependency_freshness.py --reviewed-on 2026-11-18
          echo "DEPENDENCY_FRESHNESS_SNAPSHOT_BEGIN"
          cat scripts/dependency_freshness_snapshot.json
          echo "DEPENDENCY_FRESHNESS_SNAPSHOT_END"

      - name: Commit refreshed dependency snapshot (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'scripts/dependency_freshness_snapshot.json';
            const content = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'chore(deps): refresh authoritative dependency metadata snapshot',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            });

      - name: Upload refreshed dependency snapshot for one-off validation
        uses: actions/upload-artifact@v4
        with:
          name: dependency-freshness-snapshot-${{ github.sha }}
          path: scripts/dependency_freshness_snapshot.json
          if-no-files-found: error

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:testQaUnitTest

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-unit-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/testQaUnitTest/**/*.xml
            app/build/reports/tests/testQaUnitTest/**
          if-no-files-found: warn
          retention-days: 14
