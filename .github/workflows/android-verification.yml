name: Android verification

on:
  push:
    branches: [Alpha, upgrade-ffmpeg-9.0.2]
    paths:
      - "app/**"
      - "Assets/**"
      - "branding/**"
      - "scripts/**"
      - "docs/security/**"
      - "third_party/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  pull_request:
    branches: [Alpha]
    paths:
      - "app/**"
      - "Assets/**"
      - "branding/**"
      - "scripts/**"
      - "docs/security/**"
      - "third_party/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify FFmpegKitNext 8.1.3 source-pin patch and fallback
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: 3e223118e6e8fb6208693ecf3952e77cd096f587
          path: .tmp/ffmpeg-kit-next
          persist-credentials: false

      - name: Check out FFmpeg 8.1.2 source for security patch validation
        uses: actions/checkout@v4
        with:
          repository: arthenica/FFmpeg
          ref: n8.1.2
          path: .tmp/ffmpeg-n8.1.2
          persist-credentials: false

      - name: Check out FFmpeg 8.1.3 source for security patch validation
        uses: actions/checkout@v4
        with:
          repository: arthenica/FFmpeg
          ref: n8.1.3
          path: .tmp/ffmpeg-n8.1.3
          persist-credentials: false

      - name: Test FFmpeg source pins and PSD security backport on both fallback versions
        run: |
          TAG_PATCH="$GITHUB_WORKSPACE/third_party/ffmpeg-kit-next/ffmpeg-source-tag-n8.1.3.patch"
          HOOK_PATCH="$GITHUB_WORKSPACE/third_party/ffmpeg-kit-next/ffmpeg-psd-backport-hook.patch"
          PSD_PATCH="$GITHUB_WORKSPACE/third_party/ffmpeg-kit-next/ffmpeg-psd-cve-2026-125213.patch"

          git -C .tmp/ffmpeg-kit-next apply --check "$TAG_PATCH"
          git -C .tmp/ffmpeg-kit-next apply "$TAG_PATCH"
          grep -Fq 'SOURCE_ID="n8.1.3"' .tmp/ffmpeg-kit-next/scripts/source.sh
          git -C .tmp/ffmpeg-kit-next apply --reverse --check "$TAG_PATCH"
          git -C .tmp/ffmpeg-kit-next apply --reverse "$TAG_PATCH"
          grep -Fq 'SOURCE_ID="n8.1.2"' .tmp/ffmpeg-kit-next/scripts/source.sh

          git -C .tmp/ffmpeg-kit-next apply --check "$HOOK_PATCH"
          git -C .tmp/ffmpeg-kit-next apply "$HOOK_PATCH"
          grep -Fq 'DIRECTORX_PSD_PATCH' .tmp/ffmpeg-kit-next/scripts/android/ffmpeg.sh
          git -C .tmp/ffmpeg-kit-next apply --reverse --check "$HOOK_PATCH"
          git -C .tmp/ffmpeg-kit-next apply --reverse "$HOOK_PATCH"

          for SOURCE in .tmp/ffmpeg-n8.1.2 .tmp/ffmpeg-n8.1.3; do
            git -C "$SOURCE" apply --check "$PSD_PATCH"
            git -C "$SOURCE" apply "$PSD_PATCH"
            grep -Fq 'if (s->uncompressed_size > INT_MAX)' "$SOURCE/libavcodec/psd.c"
            git -C "$SOURCE" apply --reverse --check "$PSD_PATCH"
            git -C "$SOURCE" apply --reverse "$PSD_PATCH"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check CairoSVG Pillow

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate repository branding selections
        run: python scripts/validate_branding.py

      # KSP exports the current Room schema before androidTest assets are packaged.
      # The generated version-11 snapshot is uploaded so it can be reviewed and
      # committed as the next checked-in migration baseline.
      - name: Generate and verify current Room schema
        run: |
          ./gradlew --no-daemon --stacktrace --console=plain :app:kspQaKotlin
          test -s app/schemas/com.directorx.editor.engine.db.ProjectDatabase/11.json

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:testQaUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:lintQa

      # Use the configured API 37 managed device. Resolve the task name from
      # Gradle's task catalogue rather than hard-coding AGP's generated name.
      - name: Run Android database and instrumentation tests
        run: |
          TASKS="$(./gradlew --no-daemon --console=plain :app:tasks --all)"
          TEST_TASK="$(printf '%s\n' "$TASKS" | python -c 'import re,sys; lines=sys.stdin.read().splitlines(); matches=[m.group(1) for line in lines if (m:=re.match(r"\s*(directorXApi37\w*QaAndroidTest)\s+-", line))]; print(matches[0] if matches else "")')"
          test -n "$TEST_TASK" || { echo "Managed API 37 QA instrumentation task was not registered"; exit 1; }
          ./gradlew --no-daemon --stacktrace --console=plain ":app:$TEST_TASK"

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-unit-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/testQaUnitTest/**/*.xml
            app/build/reports/tests/testQaUnitTest/**
            app/schemas/com.directorx.editor.engine.db.ProjectDatabase/11.json
          if-no-files-found: warn
          retention-days: 14
