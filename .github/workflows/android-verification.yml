name: Android verification

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Director X
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:testQaUnitTest

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-x-unit-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/testQaUnitTest/**/*.xml
            app/build/reports/tests/testQaUnitTest/**
          if-no-files-found: warn
          retention-days: 14
