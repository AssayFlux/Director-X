name: Code quality and security analysis

on:
  push:
    branches: [Alpha]
  pull_request:
    branches: [Alpha]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android compile SDK
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Python asset build dependencies
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/directorx-codeql"
          "$RUNNER_TEMP/directorx-codeql/bin/python" -m pip install --disable-pip-version-check CairoSVG Pillow
          "$RUNNER_TEMP/directorx-codeql/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements.txt
          echo "$RUNNER_TEMP/directorx-codeql/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/directorx-codeql/bin/python" -c "import cairosvg; from PIL import Image; import opentimelineio"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Build Android QA variant for compiled-language analysis
        if: matrix.language == 'java-kotlin'
        run: bash ./gradlew --no-daemon :app:assembleQa

      - name: Analyze and publish CodeQL results
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          wait-for-processing: true
