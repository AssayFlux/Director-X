name: FFmpeg 9.0.2 - App integration verification

on:
  push:
    branches: [Alpha]
    paths:
      - "app/**"
      - "third_party/ffmpeg-kit-next/**"
      - "scripts/capability_registry.json"
      - "scripts/promote_ffmpeg_kit_next_9_artifact.py"
      - "docs/models.md"
      - "README.md"
      - "NOTICE"
      - "ACKNOWLEDGMENTS.md"
      - ".github/workflows/ffmpeg-9-app-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-9-app-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install compile SDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify FFmpegKitNext artifact and app integration
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:verifyFfmpegKitAar :app:testQaUnitTest :app:assembleQa

      - name: Verify packaged FFmpegKitNext native libraries
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            python3 scripts/check_16kb_alignment.py "$apk"
          done
